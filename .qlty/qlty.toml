# Qlty (code quality analysis and coverage)
# Reference: https://qlty.sh/d/qlty-toml
config_version = "0"

# Paths that are not analyzed (dependencies and local files)
exclude_patterns = [
    "vendor/**",
    "node_modules/**",
    "tmp/**",
    "logs/**",
]

# Qlty does not compute the smells (complexity, duplication) of test files. templates/ is listed
# for that alone: the templates keep the complexity and duplication of the CakePHP 2 templates
# (the error pages, layouts and scaffolds repeat their markup). The plugins, the security plugins
# among them, do not use this list and still check templates/
test_patterns = [
    "tests/**",
    "templates/**",
]

[[source]]
name = "default"
default = true

[coverage]
ignores = [
    "tests/**",
]

# Plugins. PHP_CodeSniffer and PHPStan run in the CI workflow with the CakePHP 2 standard and
# extension, which Qlty cannot load. editorconfig-checker is not used: PHP_CodeSniffer checks the
# PHP files, and the checker applies the PHP indentation to Markdown and XML.
[[plugin]]
name = "actionlint"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-php"

[[plugin]]
name = "ripgrep"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

[smells.return_statements]
enabled = false

# CakePHP 2 conventions: models, components and helpers are properties and variables with an
# uppercase first letter ($this->User, $User, $this->Totp)
[[triage]]
match.plugins = ["radarlint-php"]
match.rules = ["radarlint-php:php:S116", "radarlint-php:php:S117"]
set.ignored = true

# Early returns (guard clauses) are preferred, so the number of returns is not limited
[[triage]]
match.plugins = ["radarlint-php"]
match.rules = ["radarlint-php:php:S1142"]
set.ignored = true

# Test classes may have many test methods
[[triage]]
match.plugins = ["radarlint-php"]
match.rules = ["radarlint-php:php:S1448"]
match.file_patterns = ["tests/**"]
set.ignored = true

# The test bootstrap and the configuration files load CakePHP 2 files with require_once
[[triage]]
match.plugins = ["radarlint-php"]
match.rules = ["radarlint-php:php:S4833"]
match.file_patterns = ["tests/bootstrap.php", "config/**"]
set.ignored = true

# Templates are HTML with PHP tags, kept as in CakePHP 2: they repeat markup, end with "?>", keep
# the output as is, are indented with tabs and use the alternative syntax without braces
[[triage]]
match.plugins = ["radarlint-php"]
match.rules = [
    "radarlint-php:php:S105",
    "radarlint-php:php:S113",
    "radarlint-php:php:S127",
    "radarlint-php:php:S1192",
    "radarlint-php:php:S1780",
    "radarlint-php:php:S3973",
    "radarlint-php:php:S6353",
]
match.file_patterns = ["templates/**"]
set.ignored = true
